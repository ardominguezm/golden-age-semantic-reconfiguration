name: Build Phase 14 Colab notebook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase14_notebook.yml'
      - 'src/phase14_robustness.py'
      - 'manuscript/phase14_robustness_protocol.md'

permissions:
  contents: write

jobs:
  build-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build self-contained Colab notebook
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          p=pathlib.Path('src/phase14_robustness.py')
          script=p.read_bytes()
          gitsha=hashlib.sha1(b'blob '+str(len(script)).encode()+b'\0'+script).hexdigest()
          packed=base64.b64encode(zlib.compress(script,9)).decode('ascii')
          md='''<a href="https://colab.research.google.com/github/ardominguezm/golden-age-semantic-reconfiguration/blob/main/notebooks/paper1_analysis.ipynb" target="_parent"><img src="https://colab.research.google.com/assets/colab-badge.svg" alt="Open In Colab"/></a>\n\n# Paper 1 — Golden Age Semantic Reconfiguration\n\n**Current stage: Phase 14 — Robustness of Semantic Reconfiguration and Null Contrast**\n\nPhase 13 produced mixed but informative evidence: the globally permuted chronology showed a localized ordering signal, while the stricter local author-overlap-preserving null did not support a primary excess-rewiring claim. Phase 14 therefore tests whether that pattern is stable under robustness axes frozen before historical validation: token-5 context, DF>=3 vocabulary, Phase-9 15/25-year windows, paired Navarro/Hernández text, and pre-semantically feasible author ablations.\n\n**Safeguard:** Phase 14 cannot redefine the governing Phase-13 N1 result. Historiographic dates (1580/1605), period labels, and change-point models remain excluded from robustness construction and tuning.\n'''
          code=f'''import base64, zlib, hashlib, os, subprocess, sys\nfrom pathlib import Path\n\nPACKED = {packed!r}\nEXPECTED_GIT_BLOB_SHA = {gitsha!r}\nscript_bytes = zlib.decompress(base64.b64decode(PACKED))\ngot = hashlib.sha1(b"blob " + str(len(script_bytes)).encode() + b"\\0" + script_bytes).hexdigest()\nassert got == EXPECTED_GIT_BLOB_SHA, (got, EXPECTED_GIT_BLOB_SHA)\nscript_path = Path('/content/phase14_robustness.py')\nscript_path.write_bytes(script_bytes)\nprint('Embedded Phase-14 script verified:', got, '| bytes:', len(script_bytes))\nenv = os.environ.copy()\nenv['PYTHONHASHSEED'] = '0'\nsubprocess.run([sys.executable, str(script_path)], env=env, check=True)\n'''
          nb={
            'cells':[
              {'cell_type':'markdown','metadata':{'id':'title'},'source':md},
              {'cell_type':'code','execution_count':None,'metadata':{'id':'phase14_runner'},'outputs':[],'source':code},
            ],
            'metadata':{'kernelspec':{'display_name':'Python 3','language':'python','name':'python3'},'language_info':{'name':'python'},'colab':{'provenance':[]}},
            'nbformat':4,'nbformat_minor':5,
          }
          pathlib.Path('notebooks/paper1_analysis.ipynb').write_text(json.dumps(nb,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          print('Notebook generated; script blob:',gitsha,'compressed chars:',len(packed))
          PY
      - name: Commit notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/paper1_analysis.ipynb
          git diff --cached --quiet && exit 0
          git commit -m 'analysis: wire phase 14 robustness notebook'
          git push
