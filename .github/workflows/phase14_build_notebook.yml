name: Build Phase 14 notebook

on:
  push:
    paths:
      - 'src/phase14_robustness.py'
      - '.github/workflows/phase14_build_notebook.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build self-contained Colab notebook
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib

          p = pathlib.Path('src/phase14_robustness.py')
          script = p.read_bytes()
          gitsha = hashlib.sha1(b'blob ' + str(len(script)).encode() + b'\0' + script).hexdigest()
          packed = base64.b64encode(zlib.compress(script, 9)).decode('ascii')

          md_lines = [
              '<a href="https://colab.research.google.com/github/ardominguezm/golden-age-semantic-reconfiguration/blob/main/notebooks/paper1_analysis.ipynb" target="_parent"><img src="https://colab.research.google.com/assets/colab-badge.svg" alt="Open In Colab"/></a>',
              '',
              '# Paper 1 — Golden Age Semantic Reconfiguration',
              '',
              '**Current stage: Phase 14 — Robustness of Semantic Reconfiguration and Null Contrast**',
              '',
              'Phase 13 produced mixed but informative evidence: the globally permuted chronology showed a localized temporal-ordering signal, while the stricter local author-overlap-preserving null did not support a primary excess-rewiring claim. Phase 14 tests whether that decomposition is stable under robustness axes frozen before historical validation: token-5 context, DF>=3 vocabulary, Phase-9 15/25-year windows, paired Navarro/Hernández text, and pre-semantically feasible author ablations.',
              '',
              '**Safeguard:** Phase 14 cannot redefine the governing Phase-13 N1 result. Historiographic dates (1580/1605), Renaissance/Baroque labels, and change-point models remain excluded from robustness construction and tuning.',
              '',
              'The analysis script is embedded in this notebook and verified against its Git blob SHA. It is executed in a fresh Python subprocess with `PYTHONHASHSEED=0`, making the design-specific null seeds reproducible despite the archived script use of Python `hash()`.',
          ]
          md = '\n'.join(md_lines) + '\n'

          code_lines = [
              'import base64, zlib, hashlib, os, subprocess, sys',
              'from pathlib import Path',
              '',
              f'PACKED = {packed!r}',
              f'EXPECTED_GIT_BLOB_SHA = {gitsha!r}',
              'script_bytes = zlib.decompress(base64.b64decode(PACKED))',
              'got = hashlib.sha1(b"blob " + str(len(script_bytes)).encode() + b"\\0" + script_bytes).hexdigest()',
              'assert got == EXPECTED_GIT_BLOB_SHA, (got, EXPECTED_GIT_BLOB_SHA)',
              "script_path = Path('/content/phase14_robustness.py')",
              'script_path.write_bytes(script_bytes)',
              "print('Embedded Phase-14 script verified:', got, '| bytes:', len(script_bytes))",
              "print('Deterministic subprocess hash seed: PYTHONHASHSEED=0')",
              'env = os.environ.copy()',
              "env['PYTHONHASHSEED'] = '0'",
              'subprocess.run([sys.executable, str(script_path)], env=env, check=True)',
          ]
          code = '\n'.join(code_lines) + '\n'

          nb = {
              'cells': [
                  {'cell_type':'markdown','metadata':{'id':'title'},'source':md},
                  {'cell_type':'code','execution_count':None,'metadata':{'id':'phase14_runner'},'outputs':[],'source':code},
              ],
              'metadata': {
                  'kernelspec': {'display_name':'Python 3','language':'python','name':'python3'},
                  'language_info': {'name':'python'},
                  'colab': {'name':'paper1_analysis.ipynb','provenance':[]},
              },
              'nbformat':4,
              'nbformat_minor':5,
          }
          out = pathlib.Path('notebooks/paper1_analysis.ipynb')
          out.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          print('Notebook generated; script blob:', gitsha, '| compressed chars:', len(packed))
          PY

      - name: Commit notebook safely
        shell: bash
        run: |
          if git diff --quiet -- notebooks/paper1_analysis.ipynb; then
            echo 'Notebook already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/paper1_analysis.ipynb
          git commit -m 'Prepare Phase 14 self-contained Colab notebook'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
